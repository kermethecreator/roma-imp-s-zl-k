<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma İmparatorluğu Terimler Sözlüğü</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Georgia", "Times New Roman", serif; }
    body { background-color: #f7f4ec; display: flex; justify-content: center; padding: 40px 16px; color: #2b2621; }
    .container { width: 100%; max-width: 620px; background: #ffffff; padding: 32px; border-radius: 6px; border: 2px solid #d4c5b9; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    h1 { font-size: 1.7rem; color: #7f1d1d; margin-bottom: 6px; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
    .subtitle { text-align: center; color: #78716c; font-size: 0.95rem; font-style: italic; margin-bottom: 24px; }
    
    .search-box { display: flex; gap: 8px; margin-bottom: 22px; }
    input { flex: 1; padding: 12px 16px; font-size: 1.05rem; border: 1px solid #d6d3d1; border-radius: 4px; outline: none; background: #fafaf9; }
    input:focus { border-color: #7f1d1d; background: #fff; }
    button { padding: 12px 22px; font-size: 1rem; background-color: #7f1d1d; color: #fef08a; border: 1px solid #5f1414; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background-color: #991b1b; }
    
    .result-card { padding: 20px; border-radius: 4px; background-color: #fafaf9; border: 1px solid #e7e5e4; border-left: 4px solid #7f1d1d; min-height: 90px; }
    
    .result-content { display: flex; align-items: center; gap: 18px; }
    .word-image { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid #d4c5b9; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .text-content { flex: 1; }
    
    .word-title { font-size: 1.35rem; font-weight: bold; color: #7f1d1d; margin-bottom: 6px; text-transform: capitalize; }
    .meaning { color: #44403c; line-height: 1.6; font-size: 1.05rem; }
    .not-found { color: #991b1b; font-weight: bold; margin-bottom: 8px; }
    .suggestions-label { font-size: 0.88rem; color: #78716c; margin-bottom: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 5px 12px; background-color: #f5f5f4; color: #7f1d1d; border-radius: 4px; font-size: 0.88rem; cursor: pointer; border: 1px solid #d6d3d1; transition: 0.2s; }
    .chip:hover { background-color: #7f1d1d; color: #ffffff; }

    /* Mobil Ekran Düzeltmeleri */
    @media (max-width: 600px) {
      body { padding: 15px 10px; }
      .container { padding: 20px 14px; }
      .search-box { flex-direction: column; gap: 10px; }
      input { min-width: 0; font-size: 1rem; width: 100%; }
      button { width: 100%; padding: 14px; }
      .result-content { flex-direction: column; text-align: center; }
      .word-image { width: 100%; height: 160px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 style="display: flex; align-items: center; justify-content: center; gap: 8px;">
    <span>🦅</span> SPQR: Roma Sözlüğü <span>⚔️</span>
  </h1>
  <p class="subtitle">Antik Roma İmparatorluğu ve Hukuku Kavramları</p>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Örn: pater familias, usucapio..." autofocus>
    <button onclick="kelimeAra()">Ara</button>
  </div>
  
  <div class="result-card" id="resultCard">
    <p style="color: #a8a29e; text-align: center;">Aramak istediğiniz terimi yazın.</p>
  </div>
</div>

<!-- 1. DIŞARIDAKİ KELİME LİSTESİNİ OKUYORUZ -->
<script src="veri.js"></script>

<!-- 2. ARAMA MANTIĞI -->
<script>
  function levenshteinMesafesi(a, b) {
    const matris = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
    for (let i = 0; i <= a.length; i++) matris[i][0] = i;
    for (let j = 0; j <= b.length; j++) matris[0][j] = j;

    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const maliyet = a[i - 1] === b[j - 1] ? 0 : 1;
        matris[i][j] = Math.min(
          matris[i - 1][j] + 1,
          matris[i][j - 1] + 1,
          matris[i - 1][j - 1] + 2 * maliyet
        );
      }
    }
    return matris[a.length][b.length];
  }

  function kelimeAra(secilenKelime = null) {
    const input = document.getElementById("searchInput");
    if (secilenKelime) input.value = secilenKelime;

    const aranan = input.value.trim().toLocaleLowerCase('tr-TR');
    const sonucAlani = document.getElementById("resultCard");

    if (!aranan) {
      sonucAlani.innerHTML = '<p style="color: #a8a29e; text-align: center;">Lütfen bir kelime yazın.</p>';
      return;
    }

    // Kelime sözlükte varsa
    if (sozluk[aranan]) {
      const veri = sozluk[aranan];
      
      const anlam = typeof veri === 'object' ? veri.anlam : veri;
      const resim = typeof veri === 'object' ? veri.resim : null;

      const resimKodu = resim ? `<img src="${resim}" alt="${aranan}" class="word-image" onerror="this.style.display='none'">` : '';

      sonucAlani.innerHTML = `
        <div class="result-content">
          ${resimKodu}
          <div class="text-content">
            <div class="word-title">${aranan}</div>
            <div class="meaning">${anlam}</div>
          </div>
        </div>
      `;
      return;
    }

    // Kelime yoksa benzerleri öner
    const benzerler = Object.keys(sozluk).filter(kelime => {
      const mesafe = levenshteinMesafesi(aranan, kelime);
      const iceriyorMu = kelime.includes(aranan) || aranan.includes(kelime);
      return mesafe <= 3 || iceriyorMu;
    });

    if (benzerler.length > 0) {
      const chipHtml = benzerler.map(k => `<span class="chip" onclick="kelimeAra('${k}')">${k}</span>`).join("");
      sonucAlani.innerHTML = `
        <div class="not-found">"${aranan}" bulunamadı.</div>
        <div class="suggestions-label">Bunu mu demek istediniz?:</div>
        <div class="chips">${chipHtml}</div>
      `;
    } else {
      sonucAlani.innerHTML = `
        <div class="not-found">"${aranan}" bulunamadı.</div>
        <p style="color: #78716c; font-size: 0.95rem;">Sözlükte benzer bir kayıt bulunmuyor.</p>
      `;
    }
  }

  document.getElementById("searchInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") kelimeAra();
  });
</script>

</body>
</html>
